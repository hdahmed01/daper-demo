# STATE STORE
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis:6379
    - name: redisPassword
      value: ""

---
# PUB/SUB
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis:6379
    - name: redisPassword
      value: ""

---
# TRACING CONFIG
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: tracing
spec:
  tracing:
    samplingRate: "1"
    zipkin:
      endpointAddress: "http://jaeger:9411/api/v2/spans"

---
# EMAIL BINDING
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: email-binding
spec:
  type: bindings.smtp
  version: v1
  metadata:
    - name: host
      value: "mailhog"
    - name: port
      value: "1025"
    - name: user
      value: ""
    - name: password
      value: ""
    - name: skipTLSVerify
      value: "true"
    - name: emailFrom
      value: "taskmanagement@example.com"
    - name: emailTo
      value: "user@example.com"
    - name: subject
      value: "Task Notification"
scopes:
  - email-service

---
# CRON BINDING
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: daily-reset-cron
spec:
  type: bindings.cron
  version: v1
  metadata:
    - name: schedule
      value: "@every 2m"
    - name: direction
      value: "input"
scopes:
  - analytics-service

---
# SUBSCRIPTIONS
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: analytics-task-created
spec:
  pubsubname: pubsub
  topic: task-created
  routes:
    default: /task-created
scopes:
  - analytics-service

---
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: analytics-status-changed
spec:
  pubsubname: pubsub
  topic: task-status-changed
  routes:
    default: /task-status-changed
scopes:
  - analytics-service

---
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: analytics-assigned
spec:
  pubsubname: pubsub
  topic: task-assigned
  routes:
    default: /task-assigned
scopes:
  - analytics-service

---
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: email-task-created
spec:
  pubsubname: pubsub
  topic: task-created
  routes:
    default: /task-created
scopes:
  - email-service

---
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: email-assignment
spec:
  pubsubname: pubsub
  topic: task-assigned
  routes:
    default: /task-assigned
scopes:
  - email-service

---
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: email-status
spec:
  pubsubname: pubsub
  topic: task-status-changed
  routes:
    default: /task-status-changed
scopes:
  - email-service

---
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: email-priority
spec:
  pubsubname: pubsub
  topic: task-priority-changed
  routes:
    default: /task-priority-changed
scopes:
  - email-service