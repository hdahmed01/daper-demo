<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Management</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
        input, select, button { margin: 5px; padding: 5px; }
    </style>
</head>
<body>
    <h1>Task Management</h1>

    <h2>Create Task</h2>
    <input type="text" id="title" placeholder="Title">
    <input type="text" id="description" placeholder="Description">
    <input type="text" id="assignedTo" placeholder="Assigned To">
    <input type="text" id="teamId" placeholder="Team ID">
    <select id="priority">
        <option value="LOW">LOW</option>
        <option value="MEDIUM" selected>MEDIUM</option>
        <option value="HIGH">HIGH</option>
        <option value="URGENT">URGENT</option>
    </select>
    <button onclick="createTask()">Create Task</button>

    <h2>Tasks</h2>
    <table id="tasksTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Description</th>
                <th>Assigned To</th>
                <th>Status</th>
                <th>Priority</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        const API_URL = 'http://localhost:8081/tasks';
        const USER_ID = 'system'; // Change if needed

        async function fetchTasks() {
            const tbody = document.querySelector('#tasksTable tbody');
            tbody.innerHTML = '';
            // For demonstration, we fetch all tasks by status OPEN
            const response = await fetch(`${API_URL}/status/OPEN`);
            const tasks = await response.json();
            tasks.forEach(task => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${task.id}</td>
                    <td>${task.title}</td>
                    <td>${task.description}</td>
                    <td>${task.assignedTo || ''}</td>
                    <td>${task.status}</td>
                    <td>${task.priority}</td>
                    <td>
                        <button onclick="deleteTask('${task.id}')">Delete</button>
                        <button onclick="assignTaskPrompt('${task.id}')">Assign</button>
                        <button onclick="updateStatusPrompt('${task.id}')">Update Status</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function createTask() {
            const task = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                assignedTo: document.getElementById('assignedTo').value,
                teamId: document.getElementById('teamId').value,
                priority: document.getElementById('priority').value
            };

            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-User-Id': USER_ID
                },
                body: JSON.stringify(task)
            });

            if (response.ok) {
                alert('Task created!');
                fetchTasks();
            } else {
                alert('Error creating task');
            }
        }

        async function deleteTask(id) {
            if (!confirm('Are you sure you want to delete this task?')) return;
            const response = await fetch(`${API_URL}/${id}`, {
                method: 'DELETE',
                headers: { 'X-User-Id': USER_ID }
            });
            if (response.ok) {
                alert('Task deleted');
                fetchTasks();
            }
        }

        async function assignTaskPrompt(id) {
            const assignedTo = prompt('Enter user to assign task:');
            if (!assignedTo) return;
            const response = await fetch(`${API_URL}/${id}/assign?assignedTo=${assignedTo}`, {
                method: 'PATCH',
                headers: { 'X-User-Id': USER_ID }
            });
            if (response.ok) {
                alert('Task assigned!');
                fetchTasks();
            }
        }

        async function updateStatusPrompt(id) {
            const status = prompt('Enter new status (OPEN, IN_PROGRESS, IN_REVIEW, COMPLETED, CANCELLED):');
            if (!status) return;
            const response = await fetch(`${API_URL}/${id}/status?status=${status}`, {
                method: 'PATCH',
                headers: { 'X-User-Id': USER_ID }
            });
            if (response.ok) {
                alert('Status updated!');
                fetchTasks();
            }
        }

        // Load tasks on page load
        fetchTasks();
    </script>
</body>
</html>
