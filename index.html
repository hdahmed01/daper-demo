<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Management Frontend</title>

    <!-- Keycloak JS -->
    <script src="https://cdn.jsdelivr.net/npm/keycloak-js@22.0.5/dist/keycloak.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        input, select, button {
            margin: 5px 0;
            padding: 6px;
            width: 250px;
        }
        .box {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<h1>🧩 Task Management</h1>

<div class="box">
    <h3>🔐 Authentication</h3>
    <button onclick="login()">Login</button>
    <button onclick="logout()">Logout</button>
    <p id="userInfo"></p>
</div>

<div class="box">
    <h3>➕ Create Task</h3>
    <input id="title" placeholder="Title"><br>
    <input id="description" placeholder="Description"><br>
    <input id="teamId" placeholder="Team ID"><br>
    <button onclick="createTask()">Create</button>
</div>

<div class="box">
    <h3>👤 Assign Task</h3>
    <input id="taskId" placeholder="Task ID"><br>
    <input id="assignedTo" placeholder="User Email"><br>
    <button onclick="assignTask()">Assign</button>
</div>

<div class="box">
    <h3>📋 All Tasks</h3>
    <button onclick="loadTasks()">Refresh</button>
    <pre id="tasks"></pre>
</div>

<script>
    const keycloak = new Keycloak({
        url: "http://localhost:8090",
        realm: "taskmanagement",
        clientId: "task-management-web"
    });

    function login() {
        keycloak.init({ onLoad: "login-required" }).then(auth => {
            if (auth) {
                document.getElementById("userInfo").innerText =
                    "Logged in as: " + keycloak.tokenParsed.preferred_username;
            }
        });
    }

    function logout() {
        keycloak.logout();
    }

    function authHeader() {
        return {
            "Authorization": "Bearer " + keycloak.token,
            "Content-Type": "application/json"
        };
    }

    // 🔹 CREATE TASK
    function createTask() {
        fetch("http://localhost:8081/tasks", {
            method: "POST",
            headers: authHeader(),
            body: JSON.stringify({
                title: document.getElementById("title").value,
                description: document.getElementById("description").value,
                teamId: document.getElementById("teamId").value,
                createdBy: keycloak.tokenParsed.email
            })
        })
        .then(res => res.json())
        .then(data => alert("Task Created: " + data.id))
        .catch(err => alert("Error creating task"));
    }

    // 🔹 ASSIGN TASK
    function assignTask() {
        const taskId = document.getElementById("taskId").value;
        const assignedTo = document.getElementById("assignedTo").value;

        fetch(`http://localhost:8081/tasks/${taskId}/assign?assignedTo=${assignedTo}`, {
            method: "PATCH",
            headers: {
                "Authorization": "Bearer " + keycloak.token,
                "X-User-Id": keycloak.tokenParsed.email
            }
        })
        .then(res => res.json())
        .then(data => alert("Assigned to " + data.assignedTo))
        .catch(err => alert("Assignment failed"));
    }

    // 🔹 LOAD TASKS
    function loadTasks() {
        fetch("http://localhost:8081/tasks", {
            headers: authHeader()
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById("tasks").innerText =
                JSON.stringify(data, null, 2);
        });
    }
</script>

</body>
</html>
