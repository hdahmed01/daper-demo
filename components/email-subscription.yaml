apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: email-task-subscription
spec:
  # Pub/Sub component (same Redis as others)
  pubsubname: pubsub

  # Subscribe to task-created topic
  topic: task-created

  # Route events to this endpoint
  routes:
    default: /task-created

  # Only email-service receives these events
  scopes:
    - email-service