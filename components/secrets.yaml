apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: local-secret-store
spec:
  type: secretstores.local.file
  version: v1
  metadata:
    # Path to secrets JSON file (relative to where you run dapr)
    - name: secretsFile
      value: ./components/secrets.json
    # Optional: Set to false in production to prevent multi-value secrets
    - name: multiValued
      value: "false"
scopes:
  - email-service