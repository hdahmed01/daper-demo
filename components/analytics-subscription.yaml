apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: analytics-task-subscription
spec:
  # Pub/Sub component name (must match pubsub.yaml)
  pubsubname: pubsub

  # Topic to subscribe to
  topic: task-created

  # Route configuration
  routes:
    # Default route when event is received
    default: /task-created

  # Scope: Only analytics-service will receive these events
  # (notification-service has its own subscription)
  scopes:
    - analytics-service